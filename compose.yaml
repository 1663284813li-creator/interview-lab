services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/interview
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-text-embedding-v4}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
